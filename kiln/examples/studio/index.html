<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kiln Studio</title>
    <style>
      :root { color-scheme: light dark; --fg:#1b1b1f; --bg:#faf9f7; --line:#ddd8d0; --accent:#a8552b; --muted:#6b6b74; }
      @media (prefers-color-scheme: dark) { :root { --fg:#eeeae4; --bg:#17171a; --line:#2e2e34; --accent:#e08a5b; --muted:#9a9aa4; } }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:15px/1.55 ui-sans-serif,system-ui,sans-serif; }
      main { width:min(34rem,90vw); padding:2rem 0; }
      h1 { margin:0 0 .2rem; font-size:1.6rem; letter-spacing:-.02em; }
      .hint { margin:0; color:var(--muted); font-size:.85rem; }
      .row { display:flex; flex-wrap:wrap; gap:.5rem; margin:1.5rem 0; }
      button { padding:.5rem .9rem; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; font-weight:500; cursor:pointer; }
      button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
      button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
      pre { margin:0; padding:1rem; border:1px solid var(--line); border-radius:8px; min-height:9rem; overflow:auto; font-family:ui-monospace,monospace; font-size:.82rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Kiln Studio</h1>
      <p class="hint">Menu bar, tray, dialogs, updater, multi-window, async commands.</p>
      <div class="row">
        <button id="stats">Stats</button>
        <button id="slow">Slow task (800 ms)</button>
        <button id="window">Open settings window</button>
        <button id="open" class="ghost">Open file...</button>
        <button id="save" class="ghost">Save as...</button>
        <button id="update" class="ghost">Check update</button>
        <button id="devtools" class="ghost">Devtools</button>
      </div>
      <pre id="log">ready</pre>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
