[package]
name = "scratch-android"
version = "0.1.0"
edition = "2021"

[lib]
name = "scratch"
crate-type = ["cdylib"]

[dependencies]
voussoir = { path = "../../../../voussoir", features = ["full"] }
voussoir-android = { path = "../../../../voussoir-android" }
# Required by tao's and wry's android_binding! macros, which expand to items here.
tao = { version = "0.37", default-features = false }
wry = { version = "0.57" }
jni = "0.21"

[workspace]
