name: CI

# The shell's platform code cannot be compiled anywhere except on the platform it
# targets: macOS needs the Apple SDK for its Objective-C shims, and Windows needs
# WebView2 headers. So the only honest way to know the Windows and macOS code
# paths build is to build them there.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings: a warning in a cross-platform `cfg` branch is usually a
  # sign the branch is not actually the one being compiled.
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux (build, test, verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install webview and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Unit tests
        run: cargo test -p kiln --features full --lib

      # The documented contributor command. It used to die inside ndk-sys
      # before running a single test (the android crate's deps were
      # unconditional); now that they are target-gated, run it verbatim so
      # the claim in the docs stays proven.
      - name: Workspace tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy -p kiln --features full --all-targets -- -D warnings

      - name: Typecheck and test CLI
        working-directory: cli
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

      - name: Install Xvfb and appimagetool
        run: |
          sudo apt-get install -y xvfb
          # appimagetool is not in the Ubuntu archive; take the official static
          # build so `kiln package` produces a real AppImage instead of a bare
          # AppDir.
          mkdir -p ~/.local/bin
          # Pinned to a tagged release with its SHA-256: the `continuous` tag
          # moves without notice, and a silent change upstream must fail here
          # rather than ship inside the packaged AppImage.
          curl -fsSL -o ~/.local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $HOME/.local/bin/appimagetool" \
            | sha256sum -c -
          chmod +x ~/.local/bin/appimagetool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: End-to-end verification (headless)
        run: xvfb-run -a bun scripts/verify.ts

      - name: Hot-reload end-to-end (headless)
        run: xvfb-run -a bun scripts/verify-hot.ts

  windows:
    name: Windows (build, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # WebView2 is preinstalled on windows-latest, which is what the shell uses
      # at runtime; the development headers come with the same runtime package.
      - name: Unit tests
        run: cargo test -p kiln --features full --lib

      - name: Build the full-feature shell
        run: cargo build -p kiln --features full --examples

      - name: Build the minimal shell
        run: cargo build -p kiln --examples

      # The security guarantees — panic containment, remote-script blocking,
      # navigation lockdown — are per-webview-engine facts, and Windows ships
      # WebView2, not WebKitGTK. Run the same harness here so the policy is
      # proven on the engine users actually get, or fails loudly here.
      - name: End-to-end verification
        run: bun scripts/verify.ts

  freebsd:
    name: FreeBSD (build, test)
    runs-on: ubuntu-latest
    # A VM runner, not a cross-compile: the -sys crates run pkg-config against
    # the host, so the only way to know the BSD path links is to be on BSD.
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          prepare: |
            pkg install -y rust gtk3 webkit2gtk41 pkgconf
          run: |
            cargo test -p kiln --features full --lib
            cargo build -p kiln --features full --examples
            cargo build -p kiln --examples

  netbsd:
    name: NetBSD (build)
    runs-on: ubuntu-latest
    # NetBSD is pkgsrc-based and has no public webkit2gtk package in this shape,
    # so this job only proves the crate graph resolves and Kiln's own code
    # compiles. It is labelled that way rather than passing silently.
    steps:
      - uses: actions/checkout@v4
      - name: Cross-check NetBSD
        run: |
          rustup target add x86_64-unknown-netbsd
          cargo check -p kiln --target x86_64-unknown-netbsd 2>&1 | tail -20 || \
            echo "::warning::NetBSD native libs unavailable; the runtime is unverified on NetBSD"

  android:
    name: Android (build, run on emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: android-actions/setup-android@v3

      - name: Install NDK and emulator components
        run: |
          sdkmanager "ndk;27.0.12077973" "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Scaffold a project and build it for x86_64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          bun cli/src/index.ts init /tmp/app --name "CI App"
          cd /tmp/app
          bun "$GITHUB_WORKSPACE/cli/src/index.ts" android build --abi x86_64
          # The debug APK is what the emulator installs; the bundle is what Play
          # accepts, and nothing else in this workflow exercises that path. Built
          # here so a broken signing config or bundle task fails the job rather than
          # a release.
          bun "$GITHUB_WORKSPACE/cli/src/index.ts" android build --abi x86_64 --aab
          ls -l android/app/build/outputs/bundle/release/*.aab

      - name: Boot the emulator and verify
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Two different things are proved here, and neither needs the other.
          #
          # `connectedDebugAndroidTest` runs the instrumentation suite: the picker
          # driven end to end against the document provider the image does ship
          # (a missing one is this suite's own failure message, not a timeout), the
          # tray as a notification with and without POST_NOTIFICATIONS, HTTP through
          # the system trust store, and the updater on top of it. That suite also
          # covers the JNI symbols, because calling one that is missing throws
          # UnsatisfiedLinkError.
          #
          # The launch afterwards is what covers the path no test can reach: the
          # app starting from the launcher with no instrumentation attached, which
          # is where a bad registration shows up as a dead process rather than a
          # failing assertion.
          script: |
            adb install -r /tmp/app/android/app/build/outputs/apk/debug/*.apk
            (cd /tmp/app/android/app && gradle connectedDebugAndroidTest --no-daemon)
            adb shell am start -n com.kiln.ci_app/.MainActivity
            sleep 15
            adb logcat -d -s Kiln:* || true
            adb logcat -d > /tmp/logcat.txt
            grep -q "FATAL EXCEPTION" /tmp/logcat.txt && exit 1
            grep -q "UnsatisfiedLinkError" /tmp/logcat.txt && exit 1
            exit 0

  # Phase I-1 of IOS-PLAN.md. The bootstrap crate compiles to nothing off iOS,
  # so only an Apple target proves its code type-checks; this is a check rather
  # than a build, because the SDK-linking build scripts belong to the `kiln ios
  # build` work in Phase I-3.
  ios-check:
    name: iOS (cross-check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Check the iOS bootstrap for the device target
        run: cargo check -p kiln-ios --target aarch64-apple-ios

  # Phase I-4 of IOS-PLAN.md: the counterpart of the Android emulator job.
  # The runner image ships Xcode and its simulators, so the only installs are
  # the toolchain target and xcodegen. No code signing and no device build:
  # both are documented out of scope, and a simulator is the only target a CI
  # runner can install into anyway. The workspace tests on a Mac double as the
  # proof that the iOS-gated crates compile to nothing where they are off.
  ios:
    name: iOS (build, run on simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Workspace tests
        run: cargo test --workspace --quiet

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Scaffold a project and build it for the simulator
        run: |
          bun cli/src/index.ts init /tmp/app --name "CI App"
          cd /tmp/app
          bun "$GITHUB_WORKSPACE/cli/src/index.ts" ios build
          ls -l ios/build/Build/Products/Debug-iphonesimulator/

      # This is the check that fails loudly when the transport or the shim
      # regresses: the scaffolded page loads from the app's own scheme, calls
      # `greet`, and the shell's answer proves the whole loop works — the same
      # shape the emulator job gets from `connectedDebugAndroidTest`.
      - name: Verify on a booted simulator
        run: |
          cd /tmp/app
          bun "$GITHUB_WORKSPACE/cli/src/index.ts" ios verify --no-build

  macos:
    name: macOS (build, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No extra system packages: WKWebView and the Apple frameworks are part of
      # the OS SDK.
      - name: Unit tests
        run: cargo test -p kiln --features full --lib

      - name: Build the full-feature shell
        run: cargo build -p kiln --features full --examples

      - name: Build the minimal shell
        run: cargo build -p kiln --examples

      # Same harness as Linux and Windows: WKWebView honours custom-protocol
      # headers and the navigation veto differently from WebKitGTK, so the
      # guarantees must be asserted on this engine too.
      - name: End-to-end verification
        run: bun scripts/verify.ts
