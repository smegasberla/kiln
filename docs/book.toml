[book]
title = "Kiln"
authors = ["Kiln contributors"]
description = "Minimal desktop, Android and iOS apps with a Rust shell and a Bun toolchain."
language = "en"
src = "src"

[build]
# A chapter that is not in SUMMARY.md, or a SUMMARY link to a missing file, is a
# documentation bug; the build fails instead of shipping an orphan page.
create-missing = false
build-dir = "book"

[output.html]
default-theme = "rust"
site-url = "/"
# The book is served from the repo and from `kiln docs`, never from a CDN, so no
# external asset is referenced and the pages work offline.
no-section-label = true

[output.html.playground]
editable = false
copyable = true
