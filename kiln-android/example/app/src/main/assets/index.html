<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kiln Android</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
             font: 16px/1.6 system-ui, sans-serif; background: #faf9f7; color: #1b1b1f; }
      @media (prefers-color-scheme: dark) { body { background: #17171a; color: #eeeae4; } }
      main { width: min(22rem, 88vw); padding: 2rem 0; text-align: center; }
      h1 { margin: 0 0 .25rem; font-size: 1.4rem; }
      p { margin: .25rem 0 1.5rem; opacity: .7; font-size: .85rem; }
      button { padding: .7rem 1.2rem; border: 0; border-radius: 8px;
               background: #a8552b; color: #fff; font: inherit; font-weight: 600; }
      #result { margin-top: 1.5rem; font-family: ui-monospace, monospace; font-size: .85rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Kiln on Android</h1>
      <p>Native command round-trip over JNI</p>
      <button id="go">Invoke Rust</button>
      <div id="result">waiting</div>
    </main>
    <script>
      const result = document.getElementById("result");
      // Report to logcat so `adb logcat` is enough to verify a headless run.
      const say = (tag, text) => console.log("KILN_CHECK " + tag + " " + text);
      window.addEventListener("load", () => {
        // Auto-invoke on load so a headless run needs no input events.
        setTimeout(async () => {
          try {
            const reply = await window.kiln.invoke("greet", { name: "auto" });
            result.textContent = reply;
          } catch (error) {
            result.textContent = "auto error: " + error.message;
          }
        }, 800);
        say("page", document.querySelector("h1")?.textContent ?? "NO_H1");
        say("kiln", typeof window.kiln);
        say("invoke", typeof window.kiln?.invoke);
      });
      document.getElementById("go").addEventListener("click", async () => {
        try {
          const reply = await window.kiln.invoke("greet", { name: "Android" });
          result.textContent = reply;
          say("roundtrip", reply);
        } catch (error) {
          result.textContent = "error: " + error.message;
        }
      });
    </script>
  </body>
</html>
